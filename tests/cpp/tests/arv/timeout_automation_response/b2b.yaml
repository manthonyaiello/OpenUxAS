# Per-test back-to-back comparison configuration.
#
# The UniqueAutomationRequest.RequestID is an internal routing counter whose
# starting value differs by design between C++ (small sequential values) and
# Ada (starts at 10,000).  The BackToBackServer already maps these IDs for
# round-trip UniqueAutomationResponse handling; suppressing the field-level
# mismatch here avoids a spurious comparison failure.
ignore_fields:
  - RequestID

# The Ada ARV intentionally lacks timer callbacks, so it never sends an
# AutomationResponse after the automation-response timeout expires.
# Mark as expected B2B failure until timer support is implemented in Ada ARV.
xfail: true
xfail_match: "Challenger timed out waiting for afrl.cmasi.AutomationResponse"
xfail_reason: >
  Ada ARV lacks timer callbacks; never sends AutomationResponse
  after the automation response timeout expires.
