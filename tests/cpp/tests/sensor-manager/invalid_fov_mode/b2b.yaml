xfail: true
xfail_match: "list length 1 vs 0"
# Ada's LMCP deserialization raises CONSTRAINT_ERROR for FieldOfViewMode=5
# (invalid enum value) before the entity config is stored, so Ada produces
# 0 footprints while C++ produces 1 footprint with AchievedGSD=0.
# This is a fundamental Ada/C++ difference: Ada's strict enum bounds checking
# vs C++'s lenient integer storage. Ada is correct to reject invalid enum values.
